<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Результаты поиска</title>
        <link rel="stylesheet" href="styles/search_results.css?v=2.0">
        <link rel="stylesheet" href="styles/header.css?v=2.0">
    </head>
    <body>

        <h1>Результаты поиска</h1>

        <!-- Контейнер для результатов поиска -->
        <div class="search-results"></div>

        <!-- Кнопка возврата на главную -->
        <button class="back-button" onclick="goBack()">🏠 На главную</button>

        <script defer src="scripts/search_results.js"></script>
        <script defer src="scripts/main.js"></script>
        <script>
            function goBack() {
                let lang = localStorage.getItem("selectedLanguage") || "ru";
                window.location.href = `index.html?lang=${lang}`;
            }
            
        </script>
        
    </body>
</html>
