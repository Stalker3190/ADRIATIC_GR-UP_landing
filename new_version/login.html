<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="styles/login.css">
</head>
<body>

    <div class="login-container">
        <h2>Вход</h2>

        <div id="loading-spinner" class="spinner" style="display: none;"></div>

        <form id="login-form">
            <label for="login">Логин:</label>
            <input type="text" id="login" required placeholder="Введите логин">
            
            <label for="accessCode">Код доступа:</label>
            <input type="password" id="accessCode" required placeholder="Введите код">
            
            <button type="submit" class="auth-btn login-btn">Войти</button>
        </form>

        <p class="register-link">Еще нет аккаунта? <a href="https://docs.google.com/forms/d/e/1FAIpQLSfLvLNsJqaEr4QIBoWJDDpkoYlSlGjKjIgql_MxDoxB-I3h6Q/viewform?usp=header" target="_blank">Зарегистрироваться</a></p>
    </div>

    <script src="login.js"></script>
</body>
</html>
