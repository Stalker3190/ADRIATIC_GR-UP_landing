<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="stylesheet" href="styles/login.css?v=2.0">
</head>
<body>
    <input type="hidden" id="loginLang">


    <div class="login-container">
        <h2 data-translate="loginTitle">Вход</h2>

        <div id="loading-spinner" class="spinner" style="display: none;"></div>

        <form id="login-form">
            <label for="login" data-translate="loginLabel">Логин:</label>
            <input type="text" id="login" required placeholder="Введите логин" data-translate-placeholder="loginPlaceholder">

            
            <label for="accessCode" data-translate="passwordLabel">Код доступа:</label>
            <input type="password" id="accessCode" required placeholder="Введите код" data-translate-placeholder="passwordPlaceholder">

            <button type="submit" class="auth-btn login-btn" data-translate="loginButton">Войти</button>
        </form>

        <p class="register-link">
            <span data-translate="registerText">Еще нет аккаунта?</span>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfLvLNsJqaEr4QIBoWJDDpkoYlSlGjKjIgql_MxDoxB-I3h6Q/viewform?usp=header" 
               target="_blank" data-translate="registerLink">Зарегистрироваться</a>
        </p>

        <button id="backToHome" class="auth-btn home-btn" data-translate="backToHome">На главную</button>

    </div>

    <script src="scripts/login.js?v=2.0"></script>
</body>
</html>
